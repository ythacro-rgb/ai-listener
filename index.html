<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Listener">
<title>AI Listener — 常時傍聴アシスタント</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ===== ヘッダー(ステータスバー) ===== -->
  <header id="statusbar">
    <div class="status-left">
      <span id="liveDot" class="live-dot off"></span>
      <span id="liveLabel" class="live-label">STANDBY</span>
      <span id="waveform" class="waveform" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
      <span id="snrLabel" class="snr-label"></span>
    </div>
    <div class="status-right">
      <span id="verLabel" class="ver-label"></span>
      <button id="saveBtn" class="icon-btn" title="テキスト保存" aria-label="テキスト保存">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button id="printBtn" class="icon-btn" title="印刷" aria-label="印刷">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="設定" aria-label="設定">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="micToggleBtn" class="icon-btn" title="マイク ON/OFF" aria-label="マイク ON/OFF">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== 分割エリア:横画面/PCは左右、縦画面は上下(自動) ===== -->
  <div id="splitArea">

    <!-- 発言(文字起こし)エリア -->
    <section id="transcriptPane" class="pane">
      <div id="transcriptLog" class="scroll-area" aria-live="polite">
        <p class="placeholder">マイクをONにすると、聞き取ったテキストがここに流れます。</p>
      </div>
      <div id="interimLine" class="interim-line"></div>
    </section>

    <!-- 仕切り:ドラッグで分割比を変更 -->
    <div id="splitDivider" title="ドラッグでエリアの大きさを変更" aria-label="表示エリアの分割比を変更">
      <span class="grip"></span>
    </div>

    <!-- AI回答(表示)エリア -->
    <section id="aiPane" class="pane">
      <div id="aiLog" class="scroll-area">
        <p class="placeholder">AIの回答がここに表示されます。</p>
      </div>
    </section>

  </div>

  <!-- ===== 最下部:モード切り替えボタン ===== -->
  <nav id="modeBar" aria-label="AIモード切り替え">
    <button class="mode-btn mode-0" data-mode="0">
      <span class="mode-num">0</span><span class="mode-name">文字起こし</span>
    </button>
    <button class="mode-btn mode-1 active" data-mode="1">
      <span class="mode-num">1</span><span class="mode-name">会話</span>
    </button>
    <button class="mode-btn mode-2" data-mode="2">
      <span class="mode-num">2</span><span class="mode-name">単語</span>
    </button>
    <button class="mode-btn mode-3" data-mode="3">
      <span class="mode-num">3</span><span class="mode-name">助言</span>
    </button>
  </nav>

</div>

<!-- ===== 設定モーダル ===== -->
<div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal-card">
    <h2 id="settingsTitle">設定</h2>

    <label class="field">
      <span class="field-label">Gemini API キー</span>
      <input type="password" id="apiKeyInput" placeholder="AIza..." autocomplete="off">
      <span class="field-hint">この端末のローカルストレージにのみ保存されます。</span>
    </label>

    <label class="field">
      <span class="field-label">モデル名</span>
      <input type="text" id="modelInput" placeholder="gemini-3.1-flash-lite-preview" autocomplete="off">
      <span class="field-hint">推奨: gemini-3.1-flash-lite-preview(高速・低価格)。gemini-2.5-flash も使用可。</span>
    </label>

    <label class="field">
      <span class="field-label">最小送信間隔(秒) — 前回送信からこの時間が経つまで発話をまとめて待つ</span>
      <input type="number" id="minIntervalInput" min="0" max="120" step="1" value="8">
      <span class="field-hint">テンポ重視なら5〜8秒。429(レート制限)が出る場合は15〜30秒に。</span>
    </label>

    <label class="field">
      <span class="field-label">無音自動停止(分) — 発話がこの時間なければマイクを自動OFF(0で無効)</span>
      <input type="number" id="autoStopInput" min="0" max="120" step="1" value="10">
      <span class="field-hint">切り忘れによる意図しないAPI消費を防ぎます。</span>
    </label>

    <label class="field">
      <span class="field-label">感知比率 — 雑音レベルの何倍で「発話中」と判定するか: <b id="vadRatioVal">2.5</b>x</span>
      <input type="range" id="vadRatioInput" min="1.05" max="6" step="0.05" value="2.5">
      <span class="field-hint">左端(1.05)=最高感度・ほぼ全ての音に反応 / 右(高)=雑音に強い。SNR表示が目安。</span>
    </label>

    <label class="field">
      <span class="field-label">発話終了猶予(ミリ秒) — 比率が閾値を下回ってから区切るまでの待ち</span>
      <input type="number" id="vadHangInput" min="300" max="5000" step="100" value="800">
    </label>

    <label class="field field-check">
      <input type="checkbox" id="vadOnInput">
      <span class="field-label-inline">音声レベル解析(VAD/SNR表示)を使用する</span>
      <span class="field-hint">iPhone/iPadでは音声認識とマイクが競合するためOFF推奨(初期値:iOSはOFF・その他はON)。OFFでも送信は2秒/10秒トリガーで動作。</span>
    </label>

    <div class="modal-actions">
      <button id="clearLogBtn" class="btn ghost">ログを消去</button>
      <div class="spacer"></div>
      <button id="settingsCancelBtn" class="btn ghost">閉じる</button>
      <button id="settingsSaveBtn" class="btn primary">保存</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
